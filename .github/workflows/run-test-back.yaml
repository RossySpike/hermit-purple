# act -P ubuntu-26.04=catthehacker/ubuntu:act-24.04
name: hermit-purple-backend-tests-github-actions
on:
  push:
    branches:
      - main
jobs:
  run-tests:
    runs-on: ubuntu-26.04
    steps:
      - name: Download backend dep
        run: sudo add-apt-repository -y universe && sudo apt update && sudo apt install -y gcc-14 python3 python3-requests libheif1 libde265-0 libheif-plugin-libde265 libvips-tools heif-thumbnailer libjpeg-turbo8-dev libheif-dev libpng-dev libwebp-dev libvips-dev

      - name: Download source
        uses: actions/checkout@v4

      - name: Set gcc14 as default
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          gcc --version

      - name: Prepare env
        run: |
          mkdir -p ./backend/test
          cat  << EOF > ./backend/tests/tests.env
          HOST="localhost:1600"
          IMG_ORIGINAL_DIR="/tmp/original/"
          IMG_THUMBNAIL_DIR="/tmp/thumbnail/"
          IMG_CACHE_DIR="/tmp/cache/"
          EOF
          echo "PATH_TO_TESTS_DIR=${GITHUB_WORKSPACE}/backend/tests" >> ./backend/tests/tests.env

      - name: Running test
        run: make -C ./backend run-tests-prod
